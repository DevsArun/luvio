name: Build Luvio Player APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Flutter build (debug + release APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (non-blocking, just shows problems in the log)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # Optional release signing.
      # Add these repo secrets to get a properly signed release APK:
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # Without them the release APK is debug-signed (still installable for testing).
      - name: Set up release keystore (only if secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret found - release APK will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/luvio-release.jks
          {
            echo "storeFile=luvio-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release keystore configured."

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle (AAB)
        run: flutter build appbundle --release || true

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-debug.apk out/ 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-release.apk out/ 2>/dev/null || true
          cp build/app/outputs/bundle/release/app-release.aab out/ 2>/dev/null || true
          ls -lh out

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luvio-player-apk
          path: out/*
          if-no-files-found: warn
